<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="userDashboard.css">
    <link rel="stylesheet" href="https://unicons.iconscout.com/release/v4.0.8/css/line.css">
    <title>Pagina Utilizador</title>
</head>
<body>
    <nav>
        <div class="logo-name">
            <div class="logo-image">
                <img src="/userDashboard/userDashboardImagens/logo 4k.jpeg" alt="logo">
            </div>
            <span class="logo_name">Universo dos Livros</span>
        </div>

        <div class="menu-itens">
            <ul class="nav-links">
                <li><a href="#">
                    <i class="uil uil-user-circle"></i>
                    <span class="link-name">Informações da Conta</span>
                </a></li>
                <li><a href="/userDashboard/historicoComprasUser/userHistoricoCompras.html">
                    <i class="uil uil-shopping-bag"></i>
                    <span class="link-name">Histórico de Compras</span>
                </a></li>
                
            </ul>
         
            <ul class="logout-mode">
                <li><a href="#">
                    <i class="uil uil-signout"></i>
                    <span class="link-name">Logout</span>
                </a></li>
            
                <li class="mode">
                    <a href="#">
                        <i class="uil uil-moon"></i>
                        <span class="link-name">Dark Mode</span>
                    </a>

                    <div class="mode-toggle">
                    <span class="switch"></span>
                    </div>

                </li>
            </ul>
        </div>
    </nav>

    <section class="principal">
        <div class="top">
            <i class="uil uil-bars sidebar-toggle"></i>

            <div class="search-box">
                <i class="uil uil-search"></i>
                <input type="text" placeholder="Pesquise aqui...">
            </div>
            <img src="/userDashboard/userDashboardImagens/perfilUsuario.jpeg" alt="gatinho estiloso perfil">
        </div>

        <div class="dash-content">
            <div class="overview">
                <div class="form-container">
                <div class="title">
                    <i class="uil uil-user-circle"></i>
                    <span class="text">Informações da Conta</span>
                </div>

                <div class="profile">                   
                    <input type="file" id="upload" accept="image/*" hidden>
                    <label for="upload" id="imageLabel">
                        <img id="profileImage" src="user.jpg" alt="">
                    </label>
                    <h2 id="nameDisplay">Idilly Camily</h2>
                    <input type="text" id="nameInput" class="hidden">
                    <button id="editNameBtn">Editar Nome</button> 
                </div>
                
                
                    <div class="title">
                        <i class="uil uil-document-info"></i>
                        <span class="text">Dados Pessoais</span>
                    </div>
                    <div class="dados-pessoais">
                        <div class="form-group "><label class="labels">Nome:</label><input type="text" class="form-control" placeholder="Nome" value=""></div>
                        <div class="form-group "><label class="labels">Sobrenome:</label><input type="text" class="form-control" value="" placeholder="Sobrenome"></div>
                        <div class="form-group "><label class="labels">Email:</label><input type="text" class="form-control" placeholder="Email" value=""></div>
                        <div class="form-group "><label class="labels">Telefone:</label><input type="text" class="form-control" placeholder="Telefone" value=""></div>
                        <div class="form-group col-md-12 mt-5 text-center"><button class="btn btn-primary profile-button" type="button">Save Profile</button></div>
                    </div>
                
                    <div class="title">
                        <i class="uil uil-document-info"></i>
                        <span class="text">Endereço</span>
                    </div>
                    <div class="endereco">
                        <div class="form-group "><label class="labels">Endereço 1:</label><input type="text" class="form-control" placeholder="Endereço 1" value=""></div>
                        <div class="form-group "><label class="labels">Número:</label><input type="text" class="form-control" placeholder="Número" value=""></div>
                        <div class="form-group "><label class="labels">Código Postal:</label><input type="text" class="form-control" placeholder="Código Postal" value=""></div>
                        <div class="form-group "><label class="labels">Freguesia:</label><input type="text" class="form-control" placeholder="Freguesia" value=""></div>
                        <div class="form-group "><label class="labels">Concelho:</label><input type="text" class="form-control" placeholder="Concelho" value=""></div>
                        <div class="form-group "><label class="labels">Estado:</label><input type="text" class="form-control" placeholder="Estado" value=""></div>
                        <div class="form-group "><label class="labels">País:</label><input type="text" class="form-control" value="" placeholder="País"></div>
                        <div class="form-group col-md-12 mt-5 text-center"><button class="btn btn-primary profile-button" type="button">Save Profile</button></div>
                    </div>
                </div>
                                       
            </div>
        </div>
    </section>
    <script src="userDashboard.js"></script>
</body>
</html>
