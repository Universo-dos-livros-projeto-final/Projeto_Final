<!DOCTYPE html>
<html lang="pt-br">
  <head>
    <meta charset="UTF-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="userHistoricoCompras.css" />
    <script src="https://cdn.tailwindcss.com"></script>
    <link
      rel="stylesheet"
      href="https://unicons.iconscout.com/release/v4.0.8/css/line.css"
    />
    <title>Pagina Utilizador</title>
  </head>
  <body>
    <nav>
      <div class="logo-name">
        <div class="logo-image">
          <img src="..//userDashboardImagens/logo 4k.jpeg" alt="logo" />
        </div>
        <span class="logo_name">Universo dos Livros</span>
      </div>

      <div class="menu-itens">
        <ul class="nav-links">
          <li>
            <a href="..//userDashboardInfo/userDashboard.html">
              <i class="uil uil-user-circle"></i>
              <span class="link-name">Informações da Conta</span>
            </a>
          </li>
          <li>
            <a href="#">
              <i class="uil uil-shopping-bag"></i>
              <span class="link-name">Histórico de Compras</span>
            </a>
          </li>
        </ul>

        <ul class="logout-mode">
          <li>
            <a href="#">
              <i class="uil uil-signout"></i>
              <span class="link-name">Logout</span>
            </a>
          </li>

          <li class="mode">
            <a href="#">
              <i class="uil uil-moon"></i>
              <span class="link-name">Dark Mode</span>
            </a>

            <div class="mode-toggle">
              <span class="switch"></span>
            </div>
          </li>
        </ul>
      </div>
    </nav>

    <section class="principal">
      <div class="top fixed top-0 left-0 w-full flex justify-between items-center px-2 py-6 bg-white border-b border-gray-200 shadow-sm transition-all duration-300 z-50">
    <i class="uil uil-bars sidebar-toggle text-2xl cursor-pointer text-gray-600 hover:text-blue-600 transition-colors duration-200"></i>
    <img
      id="profileImageHeader"
      src=""
      alt="Foto de perfil topo"
      class="w-10 h-10 rounded-full object-cover border-2 border-blue-500 cursor-pointer hover:border-blue-600 transition-colors duration-200"
    />
  </div>


   <div class="dash-content">
  <div class="overview">
    <div class="title">
      <i class="uil uil-tachometer-fast-alt"></i>
      <span class="text">Histórico de Compras</span>
    </div>

    <!-- Filtro de datas -->
    <div class="filter-container">
      <label>De: <input type="date" id="startDate"></label>
      <label>Até: <input type="date" id="endDate"></label>
      <button id="filterBtn">Filtrar</button>
      <button id="resetBtn">Limpar</button>
    </div>

    <!-- Grid de cards -->
    <div id="historyGrid" class="history-grid"></div>
  </div>
</div>


    </section>
    <script src="userHistoricoCompras.js"></script>
  </body>
</html>
