<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!--=============== FAVICON ===============-->
    <link rel="shortcut icon" href="assets/img/favicon.png" type="image/x-icon"/>
    <!--=============== REMIXICONS ===============-->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/remixicon/3.5.0/remixicon.css"/>
    <!--=============== SWIPER CSS ===============-->
    <link rel="stylesheet" href="swiper-bundle.min.css" />
    <link rel="stylesheet" href="https://stackpath.bootstrapcdn.com/bootstrap/4.5.0/css/bootstrap.min.css"/>
    <link rel="stylesheet" href="https://maxcdn.bootstrapcdn.com/font-awesome/4.7.0/css/font-awesome.min.css"/>
    <script src="https://code.jquery.com/jquery-3.5.1.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/popper.js@1.16.0/dist/umd/popper.min.js"></script>
    <script src="https://stackpath.bootstrapcdn.com/bootstrap/4.5.0/js/bootstrap.min.js"></script>
    <!--=============== CSS ===============-->
    <link rel="stylesheet" href="categorias.css" />
    <title>Universo dos livros</title>
  </head>
  <body>
    <!--==================== HEADER ====================-->
    <header class="header" id="header">
      <nav class="nav container">
        <a href="/Client/paginaInicial/index.html" class="nav__logo">
          <img src="logo 4k.jpeg" alt="Logo Universo dos Livros" class="nav__logo-img"/>
          <span class="nav__logo-text">Universo dos Livros</span>
        </a>

        <div class="nav__menu">
          <ul class="nav__list">
            <li class="nav__item">
              <a href="/Client/paginaInicial/index.html" class="nav__link">
                <i class="ri-home-line"></i>
                <span>Home</span>
              </a>
            </li>

            <li class="nav__item">
              <a href="/Client/pagCategorias/categorias.html" class="nav__link">
                <i class="ri-price-tag-3-line"></i>
                <span>Categorias</span>
              </a>
            </li>

            <li class="nav__item">
              <a href="#sobrenos" class="nav__link">
                <i class="ri-message-3-line"></i>
                <span>Sobre Nós</span>
              </a>
            </li>
          </ul>
        </div>

        <div class="nav__actions">
          <i class="ri-search-line search-button" id="search-button"></i>

          <a href="/Client/paginaLogin/paginaLogin.html" class="login"
            ><i class="ri-user-line login-button" id="login-button"></i>
          </a>
          <i class="ri-shopping-cart-line" id="carrinho"></i>
          <div id="cart-modal" class="cart-modal">
            <div class="cart-modal-content">
              <div class="cart-modal-header">
                <h2>Carrinho</h2>
                <button class="cart-modal-close">&times;</button>
              </div>

              <div class="cart-items-container" id="cart-items"></div>

              <div class="cart-summary">
                <div class="cart-total-row">
                  <span>Total</span>
                  <span id="cart-total">R$ 0,00</span>
                </div>
                <button class="cart-finalize-button">Finalizar</button>
              </div>
            </div>
          </div>

          <i class="ri-heart-line" id="favoritos"></i>
          <div id="favorites-modal" class="favorites-modal">
            <div class="favorites-modal-content">
              <div class="favorites-modal-header">
                <h2>Favoritos</h2>
                <button class="favorites-modal-close">&times;</button>
              </div>

              <div class="favorites-items-container" id="favorites-items"></div>
            </div>
          </div>

          <i class="ri-moon-line change-theme" id="theme-button"></i>
        </div>
      </nav>
    </header>

    <!--==================== SEARCH ====================-->
    <div class="search" id="search-content">
      <form action="" class="search__form">
        <i class="ri-search-line search__icon"></i>
        <input
          type="search"
          placeholder="Buscar Livros e a autores..."
          class="search__input"
        />
      </form>
    </div>

    <!-- ================= CONTEUDO PRINCIPAL ========== -->
<body class="bg-gray-50 text-gray-800 p-4">

<div class="max-w-[1600px] mx-auto flex overflow-x-auto gap-6">

  <!-- Sidebar fixa -->
  <aside class="w-52 flex-shrink-0 mt-6">
    <h2 class="font-semibold text-lg mb-4">CATEGORIAS</h2>
    <ul id="categoryList" class="space-y-2">
      <!-- Preenchido via JS -->
    </ul>
    <button id="loadMoreCategories" class="mt-4 text-indigo-600 font-medium hover:underline">ver mais</button>
  </aside>

  <!-- Conteúdo principal -->
  <main class="flex-1 min-w-[300px]">
    <!-- Topo -->
    <div class="flex justify-between items-center mb-4 flex-wrap gap-2">
      <h2 class="text-2xl font-bold">Livros</h2>
      <div class="flex gap-2">
        <button id="filterBtn" class="bg-gray-200 px-4 py-2 rounded-md font-medium hover:bg-gray-300">Filtros ☰</button>
        <button id="clearFilters" class="bg-red-100 text-red-600 px-4 py-2 rounded-md font-medium hover:bg-red-200">Limpar filtros</button>
      </div>
    </div>

    <!-- Filtros -->
    <div id="filterPanel" class="hidden bg-white border rounded-md p-4 mb-6 shadow-sm">
      <div class="grid sm:grid-cols-2 gap-4">
        <div>
          <label class="block font-medium mb-1">Autor</label>
          <select id="authorFilter" class="w-full border rounded-md p-2">
            <option value="">Todos</option>
          </select>
        </div>
        <div>
          <label class="block font-medium mb-1">Preço até: <span id="priceValue">100</span>€</label>
          <input type="range" id="priceFilter" min="0" max="100" value="100" class="w-full">
        </div>
      </div>
    </div>

    <!-- Grade de livros -->
    <div id="bookGrid" class="flex flex-wrap gap-4">
      <!-- Livros via JS -->
    </div>

    <!-- Ver mais -->
    <div class="text-center mt-6">
      <button id="loadMoreBtn" class="bg-indigo-600 text-white px-6 py-2 rounded-md hover:bg-indigo-700 hidden">Ver mais</button>
    </div>
  </main>
</div>
    <!-- ================= FOOTER ================ -->
    </footer>

    <!--=============== SCROLLREVEAL ===============-->
    <script src="scrollreveal.min.js"></script>

    <!--=============== SWIPER JS ===============-->
    <script src="swiper-bundle.min.js"></script>

    <!--=============== MAIN JS ===============-->
    <script src="categorias.js"></script>
  </body>
</html>
