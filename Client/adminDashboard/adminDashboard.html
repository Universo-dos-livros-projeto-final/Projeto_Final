<!DOCTYPE html>
<html lang="pt-br">
  <head>
    <meta charset="UTF-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="adminDashboard.css" />
    <link
      rel="stylesheet"
      href="https://unicons.iconscout.com/release/v4.0.8/css/line.css"
    />
    <title>Pagina Administrador</title>
  </head>
  <body>
    <nav>
      <div class="logo-name">
        <div class="logo-image">
          <img src="adminDashboardImagens/logo 4k.jpeg" alt="logo" />
        </div>
        <span class="logo_name">Universo dos Livros</span>
      </div>

      <div class="menu-itens">
        <ul class="nav-links">
          <li>
            <a href="/Client/adminDashboard/adminDashboard.html">
              <i class="uil uil-estate"></i>
              <span class="link-name">Principal</span>
            </a>
          </li>
          <li>
            <a
              href="/Client/adminDashboard/usuariosDashboard/usuariosDashboard.html"
            >
              <i class="uil uil-user"></i>
              <span class="link-name">Usuários</span>
            </a>
          </li>
          <li>
            <a
              href="/Client/adminDashboard/bloqueadosDashboard/bloqueadosDashboard.html"
            >
              <i class="uil uil-user-times"></i>
              <span class="link-name">Bloqueados</span>
            </a>
          </li>
          <li>
            <a
              href="/Client/adminDashboard/vendasDashboard/vendasDashboard.html"
            >
              <i class="uil uil-archive-alt"></i>
              <span class="link-name">Vendas</span>
            </a>
          </li>
          <li>
            <a
              href="/Client/adminDashboard/produtosDashboard/produtosDashboard.html"
            >
              <i class="uil uil-books"></i>
              <span class="link-name">Produtos</span>
            </a>
          </li>
          <li>
            <a
              href="/Client/adminDashboard/fornecedoresDashboard/fornecedoresDashboard.html"
            >
              <i class="uil uil-box"></i>
              <span class="link-name">Fornecedores</span>
            </a>
          </li>
        </ul>

        <ul class="logout-mode">
          <li>
            <a href="/Client/Pagina Inicial/index.html">
              <i class="uil uil-signout"></i>
              <span class="link-name">Logout</span>
            </a>
          </li>

          <li class="mode">
            <a href="#">
              <i class="uil uil-moon"></i>
              <span class="link-name">Dark Mode</span>
            </a>

            <div class="mode-toggle">
              <span class="switch"></span>
            </div>
          </li>
        </ul>
      </div>
    </nav>

    <section class="principal">
      <div class="top">
        <i class="uil uil-bars sidebar-toggle"></i>
        <img
          src="adminDashboardImagens/gatinhoEstiloso.jpeg"
          alt="gatinho estiloso perfil"
        />
      </div>

      <div class="dash-content">
        <div class="overview">
          <div class="title">
            <i class="uil uil-tachometer-fast-alt"></i>
            <span class="text">Principal</span>
          </div>
          <div class="boxes">
            <div class="box box1">
              <i class="uil uil-heart"></i>
              <span class="text">Favoritos</span>
              <span class="number" id="favCount">0</span>
            </div>
            <div class="box box2">
              <i class="uil uil-users-alt"></i>
              <span class="text">Clientes</span>
              <span class="number" id="clientCount">0</span>
            </div>
            <div class="box box3">
              <i class="uil uil-share"></i>
              <span class="text">Total Vendidos</span>
              <span class="number" id="soldCount">0</span>
            </div>
          </div>
        </div>
        <div class="activity">
          <div class="title">
            <i class="uil uil-clock-three"></i>
            <span class="text">Atividades Recentes</span>
          </div>
          <div class="activity-data">
            <div class="data names">
              <span class="data-title">Nome</span>
            </div>
            <div class="data email">
              <span class="data-title">Email</span>
            </div>
            <div class="data joined">
              <span class="data-title">Inscreveu-se</span>
            </div>
            <div class="data type">
              <span class="data-title">Tipo</span>
            </div>
            <div class="data status">
              <span class="data-title">Status</span>
            </div>
          </div>
        </div>
      </div>
    </section>

    <!-- Cookies.js para facilitar pegar token -->
    <script src="https://cdn.jsdelivr.net/npm/js-cookie@3.0.5/dist/js.cookie.min.js"></script>
    <script src="adminDashboard.js"></script>
  </body>
</html>
