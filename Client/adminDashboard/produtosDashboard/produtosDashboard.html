<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="produtosDashboard.css">
    <link rel="stylesheet" href="https://unicons.iconscout.com/release/v4.0.8/css/line.css">
    <title>Pagina Administrador</title>
</head>
<body>
    <nav>
        <div class="logo-name">
            <div class="logo-image">
                <img src="/Client/adminDashboard/adminDashboardImagens/logo 4k.jpeg" alt="logo">
            </div>
            <span class="logo_name">Universo dos Livros</span>
        </div>

        <div class="menu-itens">
            <ul class="nav-links">
                <li><a href="/Client/adminDashboard/adminDashboard.html">
                    <i class="uil uil-estate"></i>
                    <span class="link-name">Principal</span>
                </a></li>
                <li><a href="/Client/adminDashboard/usuariosDashboard/usuariosDashboard.html">
                    <i class="uil uil-user"></i>
                    <span class="link-name">Usuários</span>
                </a></li>
                <li><a href="/Client/adminDashboard/bloqueadosDashboard/bloqueadosDashboard.html">
                    <i class="uil uil-user-times"></i>
                    <span class="link-name">Bloqueados</span>
                </a></li>
                <li><a href="#">
                    <i class="uil uil-archive-alt"></i>
                    <span class="link-name">Vendas</span>
                </a></li>
                <li><a href="/Client/adminDashboard/produtosDashboard/produtosDashboard.html">
                    <i class="uil uil-books"></i>
                    <span class="link-name">Produtos</span>
                </a></li>
                <li><a href="#">
                    <i class="uil uil-clipboard-alt"></i>
                    <span class="link-name">Relatórios</span>
                </a></li>
                <li><a href="/Client/adminDashboard/fornecedoresDashboard/fornecedoresDashboard.html">
                    <i class="uil uil-box"></i>
                    <span class="link-name">Fornecedores</span>
                </a></li>
            </ul>
         
            <ul class="logout-mode">
                <li><a href="/Client/Pagina Inicial/index.html">
                    <i class="uil uil-signout"></i>
                    <span class="link-name">Logout</span>
                </a></li>
            
                <li class="mode">
                    <a href="#">
                        <i class="uil uil-moon"></i>
                        <span class="link-name">Dark Mode</span>
                    </a>

                    <div class="mode-toggle">
                    <span class="switch"></span>
                    </div>

                </li>
            </ul>
        </div>
    </nav>

    <section class="principal">
        <div class="top">
            <i class="uil uil-bars sidebar-toggle"></i>

            <div class="search-box">
                <i class="uil uil-search"></i>
                <input type="text" placeholder="Pesquise aqui...">
            </div>
            <img src="/Client/adminDashboard/adminDashboardImagens/gatinhoEstiloso.jpeg" alt="gatinho estiloso perfil">
        </div>


        <div class="dash-content">
            <div class="overview">
                <div class="title">
                    <i class="uil uil-tachometer-fast-alt"></i>
                    <span class="text"> Produtos</span>
                </div>

                
   <button class="add-btn" onclick="abrirModal()">+ Adicionar Livro</button>

  <div class="book-list" id="bookList">
    <!-- os livros aparecem aqui que estao conectados no JS -->
  </div>

  <!-- Modal -->
  <div class="modal" id="modal">
    <div class="modal-content">
      <h2 id="modalTitulo">Adicionar Livro</h2>
      <input type="text" id="imagemLivro" placeholder="URL da Imagem (opcional)">
      <input type="text" id="nomeLivro" placeholder="Nome do Livro">
      <input type="text" id="autorLivro" placeholder="Autor">
      <input type="number" id="anoLivro" placeholder="Ano">
      <input type="text" id="genre" placeholder="Genero">
      <input type="text" id="isbn" placeholder="ISBN"> 
      <input type="number" id="precoLivro" placeholder="Preço (€)" step="0.01">
      <textarea id="descricaoLivro" placeholder="Descrição do Livro" rows="4" style="width: 100%; margin-bottom: 10px; padding: 8px;"></textarea>


      <button onclick="salvarLivro()">Salvar</button>
      <button onclick="fecharModal()">Cancelar</button>
    </div>
  </div>

    </section>
    <script src="produtosDashboard.js"></script>
</body>
</html>
