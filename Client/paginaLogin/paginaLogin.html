<!DOCTYPE html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Login</title>
    <link rel="stylesheet" href="paginaLogin.css" />
    <link
      rel="shortcut icon"
      href="assets/img/favicon.png"
      type="image/x-icon"
    />
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/remixicon/3.5.0/remixicon.css"
    />
  </head>
  <body>
    <div class="container">
      <div class="container-form">
        <form onsubmit="handleSubmitLogin(event)" class="sign-in">
          <h2>Iniciar Sessão</h2>
          <div class="container-input">
            <input type="text" id="user-email" placeholder="Email" />
          </div>
          <div class="container-input">
            <input type="password" id="user-password" placeholder="Senha" />
          </div>
          <div class="container-input checkbox-container">
            <label>
              <input type="checkbox" id="admin-check" />
              Sou administrador
            </label>
          </div>
          <div id="login-feedback" class="feedback"></div>
          <a href="#"> Esqueceu a sua senha?</a>
          <button>Iniciar Sessão</button><br />
          <div class="nav__actions">
            <i class="ri-moon-line change-theme theme-button"></i>
          </div>
        </form>
      </div>

      <div class="container-form">
        <form onsubmit="handleSubmitSignUp(event)" class="sign-up">
          <h2>Criar Conta</h2>
          <div class="container-input">
            <input type="text" id="firstname" placeholder="Nome" />
          </div>
          <div class="container-input">
            <input type="text" id="lastname" placeholder="Sobrenome" />
          </div>
          <div class="container-input">
            <input type="text" id="email" placeholder="Email" />
          </div>
          <div class="container-input">
            <input type="password" id="password" placeholder="Senha" />
          </div>
          <div class="container-input">
            <input
              type="password"
              id="confirm-password"
              placeholder="Repita sua Senha"
            />
          </div>
          <div id="signup-feedback" class="feedback"></div>
          <button>Criar Conta</button><br />
          <div class="nav__actions">
            <i class="ri-moon-line change-theme theme-button"></i>
          </div>
        </form>
      </div>

      <div class="container-welcome">
        <div class="welcome-sign-up welcome">
          <div class="logo">
            <img src="..//imagens/logo 4k.jpeg" alt="Logo" />
          </div>
          <h3>Bem Vindo!</h3>
          <p>Insira seus dados pessoais para usar todos os recursos do site</p>
          <br />
          <button class="button" id="bnt-sign-up">Criar Conta</button>
          <a href="/Client/Pagina Inicial/index.html"
            ><button>Voltar ao Menu Inicial</button></a
          >
        </div>
        <div class="welcome-sign-in welcome">
          <div class="logo">
            <img src="..//imagens/logo 4k.jpeg" alt="Logo" />
          </div>
          <h3>Olá!</h3>
          <p>
            Registre com seus dados pessoais para usar todas as funcoes do site
          </p>
          <br />
          <button class="button" id="bnt-sign-in">Iniciar Sessão</button>
          <a href="/Client/Pagina Inicial/index.html"
            ><button>Voltar ao Menu Inicial</button></a
          >
        </div>
      </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/js-cookie@3.0.5/dist/js.cookie.min.js"></script>
    <script src="paginaLogin.js"></script>
    <script src="swiper-bundle.min.js"></script>
  </body>
</html>
