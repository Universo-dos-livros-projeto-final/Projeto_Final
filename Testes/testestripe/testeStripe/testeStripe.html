<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Pagar com Stripe</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- Stripe.js -->
  <script src="https://js.stripe.com/v3/"></script>
</head>
<body class="bg-gray-100 text-gray-900">
  <div class="max-w-xl mx-auto mt-10 bg-white p-6 rounded-lg shadow">
    <h2 class="text-2xl font-bold mb-6 text-center">Pagamento com Stripe</h2>

    <form id="payment-form" class="space-y-4">
      <input id="nome" type="text" placeholder="Nome completo" required class="w-full p-2 border border-gray-300 rounded" />
      <input id="email" type="email" placeholder="Email" required class="w-full p-2 border border-gray-300 rounded" />

      <div id="card-element" class="p-2 border border-gray-300 rounded"></div>

      <button id="submit" class="w-full bg-blue-600 hover:bg-blue-700 text-white py-3 rounded font-semibold">
        Pagar €34,90
      </button>

      <p id="mensagem" class="hidden text-green-600 font-medium mt-4">Pagamento realizado com sucesso!</p>
    </form>
  </div>

  <script>
    const stripe = Stripe('pk_test_51RiwxXRpegXRgAZ8mmpsxJTbCjoxZnsA9gdLBdsmF9GR27Q09Zp5F63PqASkoqtdVSTJ7vWIt6lVgCNDeyZ4OIgE00CRYBFHuT'); // 🔁 Substitua pela sua chave pública do Stripe
    const elements = stripe.elements();
    const card = elements.create('card');
    card.mount('#card-element');

    const form = document.getElementById('payment-form');
    const mensagem = document.getElementById('mensagem');

    form.addEventListener('submit', async (e) => {
      e.preventDefault();

      const { paymentIntent, error } = await stripe.confirmCardPayment(
        await criarIntentDePagamento(), {
        payment_method: {
          card: card,
          billing_details: {
            name: document.getElementById('nome').value,
            email: document.getElementById('email').value
          }
        }
      });

      if (error) {
        alert(error.message);
      } else {
        mensagem.classList.remove('hidden');
      }
    });

    // Cria PaymentIntent via backend
    async function criarIntentDePagamento() {
      const res = await fetch('http://localhost:3000/criar-intent', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({
          total: 34.90,
          nome: document.getElementById('nome').value,
          email: document.getElementById('email').value
        })
      });

      const data = await res.json();
      return data.clientSecret;
    }
  </script>
</body>
</html>
