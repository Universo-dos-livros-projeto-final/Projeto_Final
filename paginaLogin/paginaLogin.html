<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login</title>
    <link rel="stylesheet" href="paginaLogin.css">
</head>
<body>
    <div class="container">
        <div class="container-form">
            <form class="sign-in"> 
                <h2>Iniciar Sessão</h2>
               <div class="container-input">
                <ion-icon name="mail-outline"></ion-icon>
                <input type="text" placeholder="Email">
               </div>
               <div class="container-input">
                <ion-icon name="lock-closed-outline"></ion-icon>
                <input type="password" placeholder="Senha">
               </div>
               <a href="#"> Esqueceu a sua senha?</a>
               <button>Iniciar Sessão</button>
            </form>
        </div>
        <div class="container-form">
            <form class="sign-up">
                <h2> Criar Conta</h2>
               <!--  PERFIL DE USUARIO  
                 <div class="profile-pic">
                    <img src="imagensLogin/person-add-outline.svg" alt="img" id="profilePic">
                    <input type="file" id="fileInput" accept="image/*">
                </div>-->
                <div class="container-input">
                    <ion-icon name="person-outline"></ion-icon>
                    <input type="text" placeholder="Nome do Usuário">
                   </div>
                <div class="container-input">
                    <ion-icon name="mail-outline"></ion-icon>
                    <input type="text" placeholder="Email">
                   </div>
                   <div class="container-input">
                    <ion-icon name="lock-closed-outline"></ion-icon>
                    <input type="password" placeholder="Senha">
                   </div>
                   <button>Criar Conta</button>
            </form>
        </div>

        <div class="container-welcome">
            <div class="welcome-sign-up welcome">
                <div class="logo">
                    <img src="/imagens/logo 4k.jpeg" alt="Logo">                 
                    </div>
                <h3> Bem Vindo!</h3>
                <p> Insira seus dados pessoais para usar todos os recursos do site </p><br>

                <button class="button" id="bnt-sign-up"> Criar Conta </button>
            </div> 
            <div class="welcome-sign-in welcome">
                <div class="logo">
                    <img src="/imagens/logo 4k.jpeg" alt="Logo">                 
                    </div>
                <h3> Olá!</h3>
                <p> Registre com seus dados pessoais para usar todas as funcoes do site</p><br>
                <button class="button" id="bnt-sign-in"> Iniciar Sessão </button>
            </div>
        </div>
    </div>


    <script src="paginaLogin.js"></script>
    <script type="module" src="https://unpkg.com/ionicons@7.1.0/dist/ionicons/ionicons.esm.js"></script>
    <script nomodule src="https://unpkg.com/ionicons@7.1.0/dist/ionicons/ionicons.js"></script>
</body>
</html>
